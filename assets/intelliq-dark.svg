<svg xmlns="http://www.w3.org/2000/svg" width="440" height="375" viewBox="0 0 440 375" role="img" aria-label="IntelliQ, a personalized AI ecosystem. Six thin clients (web widget, browser extension, Android, desktop, VS Code, dashboard) funnel into a four-tier permission gate that fails closed. Behind it, a modular monolith where one repository file per module owns its SQL, and a hand-written multi-provider failover router. Storage is third-normal-form PostgreSQL with AES-256-GCM applied in the application layer above the database.">
<defs>
  <pattern id="dots_iq" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.1" cy="1.1" r="1" fill="#a78bfa" opacity="0.05"/></pattern>
  <linearGradient id="card_iq" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#12141f"/><stop offset="100%" stop-color="#0b0d16"/></linearGradient>
  <linearGradient id="chip_iq" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1d2e"/><stop offset="100%" stop-color="#131627"/></linearGradient>
  <linearGradient id="sweep_iq" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/><stop offset="50%" stop-color="#a78bfa" stop-opacity=".85"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow_iq" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#6366f1" stop-opacity=".30"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
  <clipPath id="clip_iq"><rect width="440" height="375" rx="14"/></clipPath></defs>
<style>
  .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .drift{animation:drift 26s linear infinite}
  @keyframes drift{to{transform:translate(22px,22px)}}
  .puls{animation:puls 3.4s ease-in-out infinite}
  @keyframes puls{0%,100%{opacity:.45}50%{opacity:1}}
  .halo{animation:halo 2.6s ease-out infinite}
  @keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .march{stroke-dasharray:3 6;animation:march 1.5s linear infinite}
  @keyframes march{to{stroke-dashoffset:-9}}
  .flow{stroke-dasharray:5 9;animation:flow 1.9s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .lit{opacity:0;animation:lit 3.4s ease-in-out infinite}
  @keyframes lit{0%{opacity:0}12%{opacity:1}34%{opacity:1}46%{opacity:0}100%{opacity:0}}
</style>
<rect width="440" height="375" rx="14" fill="url(#card_iq)"/>
<g clip-path="url(#clip_iq)">
