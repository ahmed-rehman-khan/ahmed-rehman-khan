  <linearGradient id="card_h" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#f7f8fc"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="chip_h" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef0f7"/><stop offset="100%" stop-color="#e4e8f2"/></linearGradient>
  <linearGradient id="sweep_h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/><stop offset="50%" stop-color="#7c3aed" stop-opacity=".85"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow_h" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".30"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <clipPath id="clip_h"><rect width="900" height="300" rx="16"/></clipPath>
  <linearGradient id="nm_h" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1c1e2a"/><stop offset="62%" stop-color="#1c1e2a"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
</defs>
<style>
  .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .drift{animation:drift 26s linear infinite}
  @keyframes drift{to{transform:translate(22px,22px)}}
  .puls{animation:puls 3.4s ease-in-out infinite}
  @keyframes puls{0%,100%{opacity:.45}50%{opacity:1}}
  .halo{animation:halo 2.6s ease-out infinite}
  @keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .march{stroke-dasharray:3 6;animation:march 1.5s linear infinite}
  @keyframes march{to{stroke-dashoffset:-9}}
  .flow{stroke-dasharray:5 9;animation:flow 1.9s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .step{opacity:0;animation:step 6s linear infinite}
  @keyframes step{0%{opacity:0}4%{opacity:1}16%{opacity:1}20%{opacity:0}100%{opacity:0}}
</style>
