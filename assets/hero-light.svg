<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Ahmed Rehman. Full-stack developer, app developer and AI developer. Karachi, Pakistan. Third-year BS Computer Science at IoBM, 3.87 CGPA. I build AI systems end to end, from the database schema to the kill switch. The vertical slice he owns: surface, API, logic, model, data. Open to work.">
<defs>
