</style>
<rect width="127" height="34" rx="8" fill="url(#g)" stroke="#4f46e5" stroke-opacity=".75"/>
<g clip-path="url(#c)"><rect class="sh" width="127" height="34" fill="url(#s)"/></g>
<g transform="translate(15 10)" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="6.1"/><ellipse cx="7" cy="7" rx="2.7" ry="6.1"/><path d="M1.1 7h11.8"/></g>
<text class="mono" x="38" y="21.5" font-size="11" fill="#1c1e2a">Portfolio</text>
<g class="cv" fill="none" stroke="#4f46e5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M106 13.5l3.4 3.5-3.4 3.5"/></g>
