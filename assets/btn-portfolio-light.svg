<svg xmlns="http://www.w3.org/2000/svg" width="138" height="34" viewBox="0 0 138 34" role="img" aria-label="Portfolio">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef0f7"/><stop offset="100%" stop-color="#e4e8f2"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/><stop offset="50%" stop-color="#7c3aed" stop-opacity=".13"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="127" height="34" rx="8"/></clipPath>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .sh{animation:sh 4.4s ease-in-out infinite;animation-delay:0.00s}
  @keyframes sh{0%{transform:translateX(-127px)}55%,100%{transform:translateX(127px)}}
  .cv{animation:cv 2.6s ease-in-out infinite;animation-delay:0.00s}
