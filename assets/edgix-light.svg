<svg xmlns="http://www.w3.org/2000/svg" width="440" height="375" viewBox="0 0 440 375" role="img" aria-label="Edgix, an automated and pipelined AI trading bot. A sentiment engine, a network-isolated listing scanner and a feature builder publish onto an at-least-once Redpanda event bus with a schema registry. Risk guardrails, idempotent execution and outcome logging consume from it, and no service ever calls another directly. The risk service can veto any decision and the veto is not overridable at runtime. A manual, logged kill switch is the single write path a human reaches for.">
<defs>
  <pattern id="dots_ed" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.1" cy="1.1" r="1" fill="#7c3aed" opacity="0.05"/></pattern>
  <linearGradient id="card_ed" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#f7f8fc"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="chip_ed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef0f7"/><stop offset="100%" stop-color="#e4e8f2"/></linearGradient>
  <linearGradient id="sweep_ed" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/><stop offset="50%" stop-color="#7c3aed" stop-opacity=".85"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow_ed" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".30"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <clipPath id="clip_ed"><rect width="440" height="375" rx="14"/></clipPath></defs>
<style>
  .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .drift{animation:drift 26s linear infinite}
  @keyframes drift{to{transform:translate(22px,22px)}}
  .puls{animation:puls 3.4s ease-in-out infinite}
  @keyframes puls{0%,100%{opacity:.45}50%{opacity:1}}
  .halo{animation:halo 2.6s ease-out infinite}
  @keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .march{stroke-dasharray:3 6;animation:march 1.5s linear infinite}
  @keyframes march{to{stroke-dashoffset:-9}}
  .flow{stroke-dasharray:5 9;animation:flow 1.9s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .lit{opacity:0;animation:lit 3.4s ease-in-out infinite}
  @keyframes lit{0%{opacity:0}12%{opacity:1}34%{opacity:1}46%{opacity:0}100%{opacity:0}}
</style>
